// Local emulator build: keep the installed app's signing identity and saved data.
gradle.afterProject { project, state ->
    if (project.path == ':app' && state.failure == null) {
        def android = project.extensions.findByName('android')
        if (android != null) {
            android.buildTypes.debug.signingConfig = android.signingConfigs.release
        }
    }
}
