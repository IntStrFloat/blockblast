                - generic [ref=f1e375]:
                  - paragraph [ref=f1e376]: Okay, hear me out. This is one of the best games I have found that is not taken as childish. It is a great warm up to my brain right before I leave for school. But, I only downloaded this game thinking it would be just like the ads. Where there is a line moving, and you have to break as many blocks as you can before the line reaches a block. When I started playing, tbh, I was VERY disappointed. Over all, it is a cool game that I like. But I would like there to be more games added in it, like the one where you just move the blocks, but it’s not as fun. So I would like it if it were possible to add more games to the games tab, where we can choose what game mode we want to play, being it the destroy as many blocks you can before the line reaches them. And maybe, just maybe, other people can reach out to you with game ideas to add to it…. By “game ideas” I meant different games MODES.I hope this is possible to do. Because it would be so much more fun. I’ve had experiences with games that are NOTHING like they are in the ads, and I HATE IT SO MUCH! So please, if you want someone to download a game, let it be by developing an ad that shows exactly what how the game is, and don’t make it a big conflict where one is excited to get a game, and then be discouraged because of the big lie the ad was😒 This is NOT hate. But they are just some things I wanted you to know. I love your game and all, but I just think that making a more realistic ad would being in more profit.Thank You!
