                    - generic [ref=f1e395]: emi likes sharks
                - generic [ref=f1e398]:
                  - paragraph [ref=f1e399]: Okay, so I’m a teenager, but I’m not 17 yet. I used to play this game all the time, and it was super fun! I really like the game, and while there are a lot of ads it doesn’t really bother me. But my dad just installed parental controls, and obviously since I’m not 17, I’m not allowed to have 17+ games. So I was on my phone after he installed it, and I noticed a couple of apps were missing from my phone. When I realized that Block Blast was one of them, I was pretty confused. So I went to the app store and saw that Block Blast’s age rating is 17+. Why?? There’s nothing in this game that would make it’s rating that high. The only thing I can think of are the ads, which were sometimes a little inappropriate for younger audiences. I guess it makes sense if that’s it, but I’m pretty disappointed since I won’t be able to play this game anymore because I actually liked it. Even then, most of the ads weren’t even that bad. The rating probably won’t get changed, but I just wanted to say that I think it’s pretty stupid to be so high. There aren’t a lot of games I play consistently, but Block Blast was one of them, and it really helped my anxiety. That’s my only complaint with the game, though, and I recommend it to anyone who’s okay with ads like that and doesn’t have parental controls, and also to people over 17. I’m pretty upset about not getting to play it anymore, but I’m glad I got to at all. It’s a very fun game! Sorry for the long review.
